[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analysis"
version = "0.1.0"
description = "Analyse des logs SSH et dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "psycopg2-binary>=2.9.13",
    "pymysql>=1.2.3",
    "requests>=2.34.2",
]

[tool.setuptools]
packages = ["ingestion", "processing", "serving", "storage"]
